    source_type: news
  - url: https://news.ycombinator.com/item?id=38309611
    source_type: discussion
  - url: https://blogs.microsoft.com/blog/2023/01/23/microsoftandopenaiextendpartnership/
    source_type: blog
max_depth: 1
max_pages: 6
max_links_per_page: 1
delay_seconds: 1
page_timeout_ms: 45000
